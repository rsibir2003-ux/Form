<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>

<h2>HTML Form</h2>

<form>
    <label>Name:</label><br>
    <input type="text" id="name"><br><br>

    <label>Email:</label><br>
    <input type="email" id="email"><br><br>

    <label>Mobile Number:</label><br>
    <input type="number" id="phone"><br><br>

    <label>SSLC Percentage:</label><br>
    <input type="number" id="sslc" step="0.01"><br><br>

    <label>HSC Group:</label>
    <select id="hsc">
        <option value="Biology">Biology</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Commerce">Commerce</option>
    </select>
    <br><br>

    <label>HSC Percentage:</label><br>
    <input type="number" id="hscPercent" step="0.01"><br><br>

    <label>Is Student:</label>
    <input type="checkbox" id="isStudent">
    <label for="isStudent">Yes</label>
    <br><br>

    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="Male">
    <label for="male">Male</label><br>

    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label><br>

    <input type="radio" id="others" name="gender" value="Others">
    <label for="others">Others</label><br><br>

    <input type="button" value="Submit" onclick="result()">
    <input type="reset" value="Reset">
</form>

<script>
function result() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let sslc = document.getElementById("sslc").value;
    let hsc = document.getElementById("hsc").value;
    let hscPercent = document.getElementById("hscPercent").value;
    let isStudent = document.getElementById("isStudent").checked ? "Yes" : "No";

    let gender = document.querySelector('input[name="gender"]:checked');

    gender = gender ? gender.value : "Not Selected";

    alert(
        "Form Successfully Submitted"
    );
}
</script>

</body>
</html>
